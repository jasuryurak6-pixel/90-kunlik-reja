<title>Alfa 90 — 90 Kunlik Intizom Dasturi</title>
<style>
  :root{
    --slate-950:#020617; --slate-900:#0f172a; --slate-850:#152238; --slate-800:#1e293b;
    --slate-700:#334155; --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8;
    --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9;
    --emerald-500:#10b981; --emerald-400:#34d399; --teal-400:#2dd4bf; --teal-600:#0d9488;
    --amber-500:#f59e0b; --amber-400:#fbbf24; --orange-500:#f97316; --orange-600:#ea580c;
    --rose-500:#f43f5e; --rose-400:#fb7185; --sky-400:#38bdf8; --indigo-500:#6366f1;
    --indigo-400:#818cf8; --pink-400:#f472b6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--slate-950); color:var(--slate-100);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; justify-content:space-between;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--slate-950);}
  ::-webkit-scrollbar-thumb{background:var(--slate-800);border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-700);}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .spin{animation:spin 1s linear infinite;}
  .pulse{animation:pulse 2.4s ease-in-out infinite;}
  .bounce{animation:bounce 1s ease-in-out infinite;}
  .fade-in{animation:fadeIn .15s ease-out;}

  .wrap{max-width:1280px;width:100%;margin:0 auto;padding:24px 16px;flex:1;}
  .row{display:flex;}
  .col{display:flex;flex-direction:column;}
  .gap1{gap:6px;} .gap2{gap:10px;} .gap3{gap:14px;} .gap4{gap:18px;}
  .between{justify-content:space-between;} .center{align-items:center;} .wrap-row{flex-wrap:wrap;}

  .card{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:24px;padding:20px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);}
  .card2{background:rgba(15,23,42,.6);border:1px solid var(--slate-850);border-radius:24px;padding:20px;}
  .subtle{background:rgba(2,6,23,.4);border:1px solid var(--slate-850);border-radius:20px;padding:16px;}

  h1,h2,h3,h4,p{margin:0;}
  .muted{color:var(--slate-400);}
  .muted2{color:var(--slate-500);}
  .tiny{font-size:10px;}
  .xs{font-size:11px;}
  .sm{font-size:12px;}
  .bold{font-weight:700;}
  .xbold{font-weight:800;}
  .uppercase{text-transform:uppercase;letter-spacing:.06em;}

  .btn{cursor:pointer;border:none;border-radius:12px;font-weight:700;font-size:12px;padding:10px 14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-emerald{background:var(--emerald-500);color:var(--slate-950);box-shadow:0 6px 16px -6px rgba(16,185,129,.35);}
  .btn-emerald:hover:not(:disabled){background:var(--emerald-400);}
  .btn-amber{background:linear-gradient(90deg,var(--amber-500),var(--orange-500));color:var(--slate-950);}
  .btn-amber:hover:not(:disabled){filter:brightness(1.08);}
  .btn-ghost{background:var(--slate-800);color:var(--slate-300);}
  .btn-ghost:hover:not(:disabled){background:var(--slate-700);}
  .btn-outline{background:var(--slate-950);color:var(--slate-300);border:1px solid var(--slate-800);}
  .btn-outline:hover:not(:disabled){border-color:var(--slate-700);color:var(--emerald-400);}
  .btn-danger{background:rgba(244,63,94,.12);color:#fda4af;border:1px solid rgba(244,63,94,.25);}
  .btn-danger:hover:not(:disabled){background:rgba(244,63,94,.22);}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:none;color:var(--slate-400);cursor:pointer;}
  .icon-btn:hover{color:var(--emerald-400);background:var(--slate-800);}

  .badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;}
  .badge-emerald{background:rgba(16,185,129,.1);color:var(--emerald-400);border-color:rgba(16,185,129,.25);}
  .badge-indigo{background:rgba(99,102,241,.1);color:var(--indigo-400);border-color:rgba(99,102,241,.2);}

  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--slate-950);border:1px solid var(--slate-800);border-radius:12px;
    padding:10px 14px;font-size:12px;color:var(--slate-100);font-family:inherit;outline:none;transition:.15s;
  }
  input::placeholder,textarea::placeholder{color:var(--slate-600);}
  input:focus,textarea:focus,select:focus{border-color:var(--emerald-500);}
  label.field-label{display:block;font-size:11px;text-transform:uppercase;font-weight:700;color:var(--slate-400);margin-bottom:6px;letter-spacing:.05em;}

  .tabbar{background:var(--slate-900);padding:6px;border-radius:14px;border:1px solid var(--slate-800);display:inline-flex;gap:6px;}
  .tabbtn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--slate-400);cursor:pointer;}
  .tabbtn.active{background:var(--emerald-500);color:var(--slate-950);}
  .tabbtn.active.amber{background:linear-gradient(90deg,var(--amber-500),var(--orange-500));color:var(--slate-950);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .grid-lg3{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
  @media (max-width:900px){.grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}.grid-lg3{grid-template-columns:1fr;}}

  .tpl-card{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;}
  .tpl-card.selected{border-color:var(--emerald-500);box-shadow:0 0 0 1px var(--emerald-500);}
  .tpl-card:hover{border-color:var(--slate-700);}

  .days-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;}
  @media (max-width:760px){.days-grid{grid-template-columns:repeat(6,1fr);}}
  @media (max-width:480px){.days-grid{grid-template-columns:repeat(5,1fr);}}
  .day-cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--slate-800);background:var(--slate-950);
    color:var(--slate-400);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
    cursor:pointer;position:relative;font-family:inherit;overflow:hidden;}
  .day-cell:hover{border-color:var(--slate-700);background:var(--slate-900);}
  .day-cell.done{background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(13,148,136,.1));color:var(--emerald-400);border-color:rgba(16,185,129,.4);}
  .day-cell.partial{background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(99,102,241,.05));color:var(--indigo-400);border-color:rgba(99,102,241,.3);}
  .day-cell.future{background:rgba(2,6,23,.4);color:var(--slate-600);border-color:rgba(15,23,42,.6);opacity:.6;cursor:not-allowed;}
  .day-cell.today{border-width:2px;border-color:var(--emerald-500);box-shadow:0 0 0 2px rgba(16,185,129,.2);}
  .day-cell.selected{border-width:2px;border-color:var(--amber-500);box-shadow:0 0 0 2px rgba(245,158,11,.25);}
  .day-badge-check{position:absolute;top:3px;right:3px;background:var(--emerald-500);border-radius:999px;width:13px;height:13px;display:flex;align-items:center;justify-content:center;color:var(--slate-950);}

  .habit-item{border:1px solid var(--slate-800);border-radius:16px;padding:16px;background:rgba(15,23,42,.6);transition:.15s;}
  .habit-item.done{border-color:rgba(16,185,129,.4);background:rgba(2,44,34,.08);}
  .habit-item:hover{border-color:var(--slate-700);}
  .habit-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--slate-700);background:var(--slate-950);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-top:2px;}
  .habit-check.done{background:var(--emerald-500);border-color:var(--emerald-500);color:var(--slate-950);}
  .progress-track{flex:1;background:var(--slate-950);height:8px;border-radius:999px;overflow:hidden;border:1px solid rgba(30,41,59,.8);}
  .progress-fill{height:100%;border-radius:999px;background:var(--emerald-500);transition:width .25s;}
  .chip-btn{font-size:10px;font-weight:700;background:var(--slate-950);color:var(--slate-300);border:1px solid var(--slate-800);border-radius:8px;padding:6px 10px;cursor:pointer;}
  .chip-btn:hover{color:var(--sky-400);border-color:rgba(56,189,248,.2);}

  .poster-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:10px;border:1px solid rgba(15,23,42,.6);background:rgba(2,6,23,.2);cursor:pointer;}
  .poster-row:hover{background:rgba(15,23,42,.3);}
  .poster-row.today{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4);}
  .poster-row.selected{border-color:var(--emerald-500);background:rgba(15,23,42,.9);}
  .poster-row.future{opacity:.45;}
  .poster-check{width:17px;height:17px;border-radius:5px;border:1px solid var(--slate-700);background:var(--slate-950);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate-950);}
  .poster-check.done{background:var(--emerald-500);border-color:var(--emerald-500);}
  .poster-check.future{cursor:not-allowed;background:rgba(2,6,23,.5);}

  .chat-box{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:24px;padding:20px;display:flex;flex-direction:column;height:540px;}
  .msg-row{display:flex;align-items:flex-start;gap:10px;}
  .msg-bubble{padding:10px 16px;border-radius:16px;font-size:12px;line-height:1.6;border:1px solid;max-width:85%;white-space:pre-wrap;}
  .msg-user{background:var(--emerald-500);color:var(--slate-950);font-weight:500;border-color:rgba(52,211,153,.2);border-bottom-right-radius:2px;}
  .msg-assistant{background:var(--slate-950);color:var(--slate-200);border-color:var(--slate-850);border-bottom-left-radius:2px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:24px;padding:24px;max-width:460px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative;}

  .stat-card{background:var(--slate-950);border:1px solid var(--slate-850);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;}
  .stat-icon{padding:10px;border-radius:12px;}

  header.topbar{background:var(--slate-900);border-bottom:1px solid var(--slate-800);position:sticky;top:0;z-index:40;}
  footer.foot{padding:24px 0;border-top:1px solid var(--slate-900);text-align:center;font-size:10px;color:var(--slate-600);}

  ::selection{background:rgba(16,185,129,.3);}
  .link-btn{background:none;border:none;color:var(--slate-500);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;padding:6px;}
  .link-btn:hover{color:var(--rose-400);}

  .dropzone{border:2px dashed var(--slate-800);background:rgba(2,6,23,.4);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;aspect-ratio:16/9;cursor:pointer;transition:.15s;}
  .dropzone:hover{border-color:var(--slate-700);}
  .dropzone.drag{border-color:var(--emerald-500);background:rgba(16,185,129,.08);}
  .photo-preview{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--slate-950);border:1px solid var(--slate-800);}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-preview .rm{position:absolute;top:8px;right:8px;background:rgba(2,6,23,.7);border:none;color:#fda4af;border-radius:8px;padding:6px 8px;cursor:pointer;}

  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
  .gallery-item{background:var(--slate-950);border:1px solid var(--slate-850);border-radius:16px;overflow:hidden;cursor:pointer;}
  .gallery-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
  .gallery-item .g-note{padding:10px;font-size:10px;color:var(--slate-300);}
</style>
</head>

function getSmartCoachingFallback(message, currentDay, completedHabitsCount, totalHabitsCount){
  const msg = (message||"").toLowerCase();
  if(msg.includes("suv")||msg.includes("ichish")||msg.includes("ml")){
    return `💧 **Suv balansi — tanangiz va miyangizning asosi!**\n\nKuniga kamida **3 litr (3000 ml)** toza suv ichish metabolizmni tezlashtiradi va miya faoliyatini oshiradi.\n\n**Alfa maslahat:**\n- Ertalab turishingiz bilan 2 stakan iliq suv iching.\n- Hozir 90 kunlik rejaning **${currentDay}-kunidasiz** (${completedHabitsCount}/${totalHabitsCount} topshiriq bajarilgan).`;
  } else if(msg.includes("ovqat")||msg.includes("shirin")||msg.includes("fast")||msg.includes("shakar")||msg.includes("parhez")||msg.includes("taom")){
    return `🥗 **Sog'lom ovqatlanish — bu kuch va intizom poydevori!**\n\n**Alfa maslahat:**\n1. Gazli ichimliklar, shirinliklar va oq nondan voz keching.\n2. Tovuq go'shti, tuxum, sabzavotlar va yong'oqlarni ko'proq iste'mol qiling.\n3. Kechki 19:00 dan keyin og'ir ovqatlar yemang.\n\nBugun, **${currentDay}-kunda** to'g'ri ovqatlanganingizga ishonch hosil qiling!`;
  } else if(msg.includes("mashq")||msg.includes("yugurish")||msg.includes("sport")||msg.includes("charchoq")||msg.includes("dangasalik")||msg.includes("kuch")){

/* ============================= BUSINESS LOGIC ============================= */
function setupChallenge(title, description, habits, quote){
  const daysMap = {};
  for(let d=1; d<=90; d++){
    const habitsCompleted={}, habitValues={};
    habits.forEach(h=>{ habitsCompleted[h.id]=false; habitValues[h.id]=0; });
    daysMap[d] = {day:d, habitsCompleted, habitValues, notes:"", photo:"", completed:false};
  }
  challengeState = {title, description, habits, startDate:new Date().toISOString(), days:daysMap, currentDay:1, motivationQuote:quote};
  persistState();
  ui.selectedDay = 1;
  chatHistory = [{
    id:"welcome-msg", role:"assistant",
    text:`Salom g'olib! Men sizning **Alfa Murabbiyingizman**. 🚀\n\nSiz uchun maxsus **"${title}"** nomli 90 kunlik shaxsiy rejangizni tayyorladim.\n\nHar kuni belgilangan odatlarni bajaring. Har bir kunni muvaffaqiyatli yakunlash sizni yangi insonga aylantiradi. Tayyormisiz? Qani ketdik!`,
    timestamp:new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})
  }];
  persistChat();
  render();
}
function calculateStreak(){
  if(!challengeState) return 0;
  let streak=0, startDay=challengeState.currentDay;
  if(!challengeState.days[startDay]?.completed && startDay>1) startDay--;
  for(let d=startDay; d>=1; d--){
    if(challengeState.days[d]?.completed) streak++; else break;
  }
  return streak;
}
function toggleHabit(dayNum, habitId){
  const dayData = {...challengeState.days[dayNum]};
  dayData.habitsCompleted = {...dayData.habitsCompleted, [habitId]: !dayData.habitsCompleted[habitId]};
  const habit = challengeState.habits.find(h=>h.id===habitId);
  if(habit){
    dayData.habitValues = {...dayData.habitValues};
    dayData.habitValues[habitId] = dayData.habitsCompleted[habitId] ? habit.targetValue : 0;
  }
  const total = challengeState.habits.length;
  const completedCount = challengeState.habits.filter(h=>dayData.habitsCompleted[h.id]).length;
  dayData.completed = completedCount===total;
  if(dayData.completed) dayData.completedAt=new Date().toISOString(); else delete dayData.completedAt;
  challengeState.days = {...challengeState.days, [dayNum]:dayData};
  if(dayNum===challengeState.currentDay && dayData.completed && challengeState.currentDay<90){
    challengeState.currentDay++;
  }
  persistState(); render();
}
function changeHabitValue(dayNum, habitId, delta){
  const dayData = {...challengeState.days[dayNum]};
  dayData.habitValues = {...dayData.habitValues};
  const habit = challengeState.habits.find(h=>h.id===habitId);
  const newVal = Math.max(0, (dayData.habitValues[habitId]||0)+delta);
  dayData.habitValues[habitId] = newVal;
  dayData.habitsCompleted = {...dayData.habitsCompleted, [habitId]: newVal >= habit.targetValue};
  const total = challengeState.habits.length;
  const completedCount = challengeState.habits.filter(h=>dayData.habitsCompleted[h.id]).length;
  dayData.completed = completedCount===total;
  if(dayData.completed) dayData.completedAt=new Date().toISOString(); else delete dayData.completedAt;
  challengeState.days = {...challengeState.days, [dayNum]:dayData};
  if(dayNum===challengeState.currentDay && dayData.completed && challengeState.currentDay<90){
    challengeState.currentDay++;
  }
  persistState(); render();
}
function saveJournal(dayNum, notes, photo){
  challengeState.days = {...challengeState.days, [dayNum]: {...challengeState.days[dayNum], notes, photo}};
  persistState(); render();
}
function addCustomHabit(name, desc, category, target, unit){
  const id = uid("custom");
  const habit = {id, name, description: desc || "Foydalanuvchi tomonidan qo'shilgan shaxsiy odat.", category, targetValue: target, unit};
  challengeState.habits = [...challengeState.habits, habit];
  const days = {...challengeState.days};
  for(let d=1; d<=90; d++){
    days[d] = {...days[d], habitsCompleted:{...days[d].habitsCompleted,[id]:false}, habitValues:{...days[d].habitValues,[id]:0}, completed:false};
  }
  challengeState.days = days;
  ui.showAddHabitModal=false;
  persistState(); render();
}
function deleteHabit(habitId){
  const h = challengeState.habits.find(x=>x.id===habitId);
  if(!h) return;
  if(!confirm(`"${h.name}" odatini butunlay o'chirib tashlamoqchimisiz? Ushbu odatga oid barcha 90 kunlik ma'lumotlar o'chiriladi!`)) return;
  challengeState.habits = challengeState.habits.filter(x=>x.id!==habitId);
  const days = {...challengeState.days};
  for(let d=1; d<=90; d++){
    const dd = {...days[d]};
    const hc = {...dd.habitsCompleted}; delete hc[habitId];
    const hv = {...dd.habitValues}; delete hv[habitId];
    dd.habitsCompleted=hc; dd.habitValues=hv;
    const total = challengeState.habits.length;
    dd.completed = total>0 ? challengeState.habits.filter(x=>hc[x.id]).length===total : false;
    days[d]=dd;
  }
  challengeState.days = days;
  persistState(); render();
}
function saveEditedHabit(updated){
  challengeState.habits = challengeState.habits.map(h=>h.id===updated.id?updated:h);
  const days = {...challengeState.days};
  for(let d=1; d<=90; d++){
    const dd = {...days[d]};
    const hv = {...dd.habitValues}; const hc = {...dd.habitsCompleted};
    if(hv[updated.id]===undefined) hv[updated.id]=0;
    if(hc[updated.id] && hv[updated.id]===0) hv[updated.id]=updated.targetValue;
    hc[updated.id] = hv[updated.id] >= updated.targetValue;
    dd.habitValues=hv; dd.habitsCompleted=hc;
    const total = challengeState.habits.length;
    dd.completed = challengeState.habits.filter(x=>hc[x.id]).length===total;
    days[d]=dd;
  }
  challengeState.days = days;
  ui.editingHabitId = null;
  persistState(); render();
}
function setCurrentDay(d){ if(d<1||d>90) return; challengeState.currentDay=d; persistState(); render(); }
function resetChallenge(){
  if(!confirm("Rostdan ham barcha natijalaringizni o'chirib, dasturni boshidan boshlamoqchimisiz?")) return;
  localStorage.removeItem("alfa90_challenge_state");
  localStorage.removeItem("alfa90_chat_history");
  challengeState=null; chatHistory=[]; ui.selectedDay=1; ui.viewMode="poster";
  render();
}
function exportData(){
  const dataStr = JSON.stringify({state:challengeState, chatHistory}, null, 2);
  const uriContent = "data:application/json;charset=utf-8,"+encodeURIComponent(dataStr);
  const a = document.createElement("a");
  a.setAttribute("href", uriContent);
  a.setAttribute("download", `alfa90_progress_backup_${new Date().toISOString().slice(0,10)}.json`);
  a.click();
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed.state && parsed.state.habits && parsed.state.days){
        challengeState = parsed.state;
        ui.selectedDay = parsed.state.currentDay || 1;
        chatHistory = parsed.chatHistory || [];
        persistState(); persistChat();
        alert("Ma'lumotlar muvaffaqiyatli tiklandi! Shon-sharaf yo'lini davom ettiring!");
        render();
      } else { alert("Xato: Noto'g'ri zaxira fayl formati!"); }
    }catch(err){ alert("Faylni o'qishda xatolik yuz berdi!"); }
  };
  reader.readAsText(file,"UTF-8");
}
function sendCoachMessage(text){
  if(!text.trim() || ui.coachLoading) return;
  const dayProgress = challengeState.days[ui.selectedDay] || {habitsCompleted:{}};
  const completedCount = Object.values(dayProgress.habitsCompleted).filter(Boolean).length;
  chatHistory = [...chatHistory, {id:uid("msg-user"), role:"user", text, timestamp:new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})}];
  persistChat();
  ui.coachLoading = true;
  render();
  setTimeout(()=>{
    const reply = getSmartCoachingFallback(text, challengeState.currentDay, completedCount, challengeState.habits.length);
    chatHistory = [...chatHistory, {id:uid("msg-ai"), role:"assistant", text:reply, timestamp:new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})}];
    persistChat();
    ui.coachLoading = false;
    render();
  }, 700 + Math.random()*500);
}

function habitMeta(habit){

  if(cat.includes("sog'liq")||cat.includes("sogliq")||cat.includes("ovqat")){

/* ============================= RENDER: HABIT ITEM ============================= */
function renderHabitItem(habit, dayProgress){
  const done = dayProgress.habitsCompleted[habit.id]||false;
  const value = dayProgress.habitValues[habit.id]||0;
  const meta = habitMeta(habit);
  const isWater = habit.id.includes("water")||habit.name.toLowerCase().includes("suv")||habit.unit==="ml";
  const isPage = habit.unit==="sahifa";
  const isMinute = habit.unit==="daqiqa";
  const pct = Math.min(100, Math.round((value/habit.targetValue)*100))||0;
  let controls;
  if(isWater){
    controls = `<button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="250">+250ml</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="500">+500ml</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="1000">+1L</button>`;
  } else if(isPage){
    controls = `<button class="icon-btn" style="background:var(--slate-950);border:1px solid var(--slate-800);" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="-1">${ic('minus',13)}</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="1">+1 bet</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="5">+5 bet</button>`;
  } else if(isMinute){
    controls = `<button class="icon-btn" style="background:var(--slate-950);border:1px solid var(--slate-800);" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="-5">${ic('minus',13)}</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="5">+5daq</button>
    <button class="chip-btn" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="15">+15daq</button>`;
  } else {
    controls = `<button class="icon-btn" style="background:var(--slate-950);border:1px solid var(--slate-800);" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="-1" ${value===0?'disabled':''}>${ic('minus',13)}</button>
    <button class="icon-btn" style="background:var(--slate-950);border:1px solid var(--slate-800);" data-action="incr-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}" data-delta="1">${ic('plus',13)}</button>`;
  }
  return `<div class="habit-item ${done?'done':''}">
    <div class="row between" style="gap:14px;">
      <div class="row gap3" style="flex:1;align-items:flex-start;">
        <button class="habit-check ${done?'done':''}" data-action="toggle-habit" data-day="${ui.selectedDay}" data-habit="${habit.id}">${done?ic('check',15):''}</button>
        <div>
          <div class="row center gap2 wrap-row" style="margin-bottom:4px;">
            <span class="sm bold" style="${done?'color:var(--slate-400);text-decoration:line-through;':'color:var(--slate-200);'}">${escapeHtml(habit.name)}</span>
            <span class="badge" style="border-color:${meta.color}33;color:${meta.color};background:${meta.color}1a;">${meta.badge}</span>
            <button class="icon-btn" style="width:22px;height:22px;" data-action="open-edit-habit" data-habit="${habit.id}">${ic('edit',13)}</button>
            <button class="icon-btn" style="width:22px;height:22px;color:var(--slate-500);" data-action="delete-habit" data-habit="${habit.id}">${ic('trash',13)}</button>
          </div>
          <p class="xs muted" style="line-height:1.5;">${escapeHtml(habit.description)}</p>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:20px;">${meta.emoji}</div>
        <div class="mono xs bold" style="margin-top:6px;"><span style="color:${done?'var(--emerald-400)':'var(--slate-200)'};">${value}</span><span class="muted2"> / ${habit.targetValue}</span> <span class="muted2 tiny">${habit.unit}</span></div>
      </div>
    </div>
    <div class="row center gap3" style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(30,41,59,.5);flex-wrap:wrap;">
      <div class="row center gap2" style="flex:1;min-width:120px;">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;${isWater?'background:var(--sky-400);':''}"></div></div>
        <span class="mono tiny bold muted2" style="width:32px;text-align:right;">${pct}%</span>
      </div>
      <div class="row gap1">${controls}</div>
    </div>
  </div>`;

function svgBars(data, color, max){
  const w=100/data.length;
  return `<svg viewBox="0 0 300 140" preserveAspectRatio="none" style="width:100%;height:100%;">
    ${data.map((d,i)=>{
      const h = max>0 ? (d.value/max)*110 : 0;
      const x = i*(300/data.length)+4;
      const bw = (300/data.length)-8;
      return `<rect x="${x}" y="${130-h}" width="${bw>2?bw:2}" height="${h}" rx="3" fill="${color}" opacity="0.85"/>`;
    }).join("")}
    <line x1="0" y1="130" x2="300" y2="130" stroke="var(--slate-800)" stroke-width="1"/>
  </svg>`;
}

  if(!t) return;

  switch(action){
    case "setup-tab": ui.setupTab = t.dataset.tab; render(); break;

      const tmpl = CHALLENGE_TEMPLATES.find(x=>x.id===t.dataset.tpl);

    case "select-day": ui.selectedDay = parseInt(t.dataset.day); render(); break;
    case "set-stage": ui.dashboardStage = parseInt(t.dataset.stage); render(); break;
    case "toggle-habit": toggleHabit(parseInt(t.dataset.day), t.dataset.habit); break;

    case "incr-habit": changeHabitValue(parseInt(t.dataset.day), t.dataset.habit, parseInt(t.dataset.delta)); break;
    case "open-edit-habit": ui.editingHabitId = t.dataset.habit; render(); break;

    case "delete-habit": deleteHabit(t.dataset.habit); break;

document.addEventListener("change", (e)=>{
  if(e.target.matches("[data-action='import-file']")){
    if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
  }
  if(e.target.matches("[data-action='upload-photo']")){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){ alert("Iltimos, faqat rasm faylini yuklang!"); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        let w=img.width, h=img.height; const MAX=700;
        if(w>h){ if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; } } else { if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; } }
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const compressed = canvas.toDataURL("image/jpeg", 0.65);
        const dp = challengeState.days[ui.selectedDay];
        saveJournal(ui.selectedDay, dp.notes||"", compressed);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
});

    const phrases = ["Sizning jismoniy maqsadlaringiz tahlil qilinmoqda...","To'g'ri oziqlanish tartibi shakllantirilmoqda...","Kitob mutolaasi vaqti rejalashtirilmoqda...","Sun'iy intellekt maxsus intizom qoidalarini yozmoqda...","Deyarli tayyor! 90 kunlik yangi hayotingizga tayyorlaning..."];
    let idx=0;
    const interval = setInterval(()=>{ idx=(idx+1)%phrases.length; ui.aiGenLoadingText=phrases[idx]; render(); }, 900);
    setTimeout(()=>{
      clearInterval(interval);
      const plan = getSuggestedChallengeFallback(goals, gender, fitnessLevel, ui.aiCategory);
      ui.aiGenLoading = false;
      setupChallenge(plan.title, plan.description, plan.habits, plan.motivationQuote);
    }, 3600);
    return;
  }
  if(form.dataset.form==="add-habit"){
    const fd = new FormData(form);
    addCustomHabit(fd.get("name"), fd.get("desc"), fd.get("category"), parseInt(fd.get("target"))||1, fd.get("unit"));
    return;
  }
  if(form.dataset.form==="edit-habit"){
    const fd = new FormData(form);
    const habit = challengeState.habits.find(h=>h.id===form.dataset.habit);
    saveEditedHabit({...habit, name:fd.get("name"), description:fd.get("desc"), category:fd.get("category"), targetValue:parseInt(fd.get("target"))||1, unit:fd.get("unit")});
    return;
  }
  if(form.dataset.form==="chat-send"){
    const input = document.getElementById("chat-input");
    const text = input.value;
    input.value = "";
    sendCoachMessage(text);
    return;
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape"){ if(ui.showAddHabitModal||ui.editingHabitId){ ui.showAddHabitModal=false; ui.editingHabitId=null; render(); } }
});

/* ============================= INIT ============================= */
loadPersisted();
render();
</script>
</body>
</html>
